<section class="section section-light">
  <div class="container setlist-catalog">
    <h1>📋 Setlists</h1>

    <!-- Create new setlist (Admin Only) -->
    <div class="new-setlist" *ngIf="isAdmin">
      <input
        type="text"
        [(ngModel)]="newSetlistName"
        placeholder="New setlist name"
        class="input"
      />
      <button
        class="btn btn-primary"
        (click)="createSetlist()"
        [disabled]="creating || !newSetlistName.trim()">
        {{ creating ? 'Creating…' : '➕ Create Setlist' }}
      </button>
    </div>

    <!-- Search for setlists by song -->
    <div class="search-bar">
      <input
        type="text"
        [(ngModel)]="songSearch"
        placeholder="Search setlists by song name..."
        class="input"
        (input)="onSongSearchChange()" />
      <button class="btn btn-ghost" (click)="clearSearch()" *ngIf="songSearch">
        ✖ Clear
      </button>
    </div>

    <p class="muted" *ngIf="errorMsg">{{ errorMsg }}</p>

    <!-- Loading & empty states -->
    <div *ngIf="loading">Loading…</div>
    <div *ngIf="!loading && setlists.length === 0">
      <p class="muted">
        {{ songSearch ? 'No setlists contain that song.' : 'No setlists yet.' }}
      </p>
    </div>

    <!-- Setlist results -->
    <div class="setlist-grid" *ngIf="!loading && setlists.length > 0">
      <div class="setlist-card" *ngFor="let s of setlists">
        <h3>
          <a [routerLink]="['/setlists', s.id]" class="setlist-link">
            {{ s.name }}
          </a>
        </h3>

        <div *ngIf="s.songs && s.songs.length > 0; else noSongs">
          <ul>
            <li *ngFor="let song of s.songs.slice(0, 3)">
              {{ song.songs?.title }}
            </li>
            <li *ngIf="s.songs.length > 3" class="muted">
              +{{ s.songs.length - 3 }} more…
            </li>
          </ul>
        </div>

        <ng-template #noSongs>
          <p class="muted">No songs added yet.</p>
        </ng-template>
      </div>
    </div>
  </div>
</section>
